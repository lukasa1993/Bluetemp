[workspace]
members = ["crates/bluetemp-ota"]
resolver = "3"

[package]
name = "bluetemp"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
default = ["firmware"]
firmware = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "bluetemp"
path = "src/main.rs"
required-features = ["firmware"]
test = false
bench = false

[dependencies]
bluetemp-ota = { version = "=0.1.0", path = "crates/bluetemp-ota" }
heapless = "=0.9.3"
picoserve = { version = "=0.20.0", default-features = false, features = ["json"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive"] }
sht4x = { version = "=0.2.0", features = ["embedded-hal-async"] }
embedded-hal-async = "=1.0.0"
embedded-io-async = "=0.7.0"
embassy-time = "=0.5.1"
embassy-sync = "=0.8.0"
task-watchdog = { version = "=0.1.2", default-features = false }

[target.'cfg(target_arch = "xtensa")'.dependencies]
embassy-executor = "=0.10.0"
embassy-net = { version = "=0.9.1", default-features = false, features = ["dhcpv4", "medium-ethernet", "tcp", "proto-ipv4"] }
embassy-time = "=0.5.1"
embassy-sync = "=0.8.0"
embassy-futures = "=0.1.2"
picoserve = { version = "=0.20.0", default-features = false, features = ["embassy", "log"] }
esp-hal = { version = "=1.2.1", features = ["esp32", "unstable", "log-04"] }
esp-rtos = { version = "=0.4.0", features = ["esp32", "embassy"] }
esp-println = { version = "=0.18.0", features = ["esp32", "log-04"] }
esp-backtrace = { version = "=0.20.0", features = ["esp32", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32", "embedded-storage"] }
esp-storage = { version = "=0.10.0", features = ["esp32"] }
static_cell = "=2.1.1"

[dev-dependencies]
embedded-storage = "=0.3.1"
hmac = { version = "=0.12.1", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
picoserve = { version = "=0.20.0", features = ["tokio"] }
tokio = { version = "=1.53.1", features = ["rt", "macros", "io-util", "time", "test-util"] }
embedded-hal-mock = { version = "=0.11.1", default-features = false, features = ["eh1", "embedded-hal-async"] }
serde_json = "=1.0.151"
md-5 = "=0.10.6"

[target.'cfg(not(target_arch = "xtensa"))'.dev-dependencies]
embassy-time = { version = "=0.5.1", features = ["mock-driver", "generic-queue-8"] }
critical-section = { version = "=1.2.0", features = ["std"] }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["std", "embedded-storage"] }

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
large_futures = "allow"
